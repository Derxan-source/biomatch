name: Validate BioMatch
on:
  push:
    branches: [feature/turso-persistence]
  pull_request:
    branches: [feature/turso-persistence, feature/full-learning-platform, main]
jobs:
  syntax-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
